# Entorno de desarrollo / demostración.
#   docker compose up -d                        → solo PostgreSQL (para `npm run dev`)
#   docker compose --profile demo up --build    → PostgreSQL + API de demostración
# La API de Docker usa el puerto 3000 igual que `npm run dev`: por eso solo corre con el perfil
# `demo`. No publica la app de meseros; los celulares se conectan con `npm run dev` o el
# instalador. En producción el servidor se distribuye como instalador único (docs/DEPLOYMENT.md).

name: karbon

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-karbon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-karbon}
      POSTGRES_DB: ${POSTGRES_DB:-karbon}
      TZ: UTC
    ports:
      - '${POSTGRES_PORT:-55432}:5432'
    # PostgreSQL 18 guarda los datos en un subdirectorio versionado de /var/lib/postgresql.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    profiles: [demo]
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-log}
      DATABASE_URL: postgresql://${POSTGRES_USER:-karbon}:${POSTGRES_PASSWORD:-karbon}@postgres:5432/${POSTGRES_DB:-karbon}?schema=public
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      # Solo para este entorno: cámbialos antes de exponer el servidor a otros equipos.
      JWT_SECRET: ${JWT_SECRET:-solo-para-docker-compose-cambiar-en-produccion}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-KarbonDemo2026!}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - '${BACKEND_PORT:-3000}:3000'

volumes:
  postgres-data:
