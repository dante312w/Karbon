version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      prisma:
        patterns: ['prisma', '@prisma/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      vite:
        patterns:
          ['vite', '@vitejs/*', 'vite-plugin-pwa', '@vite-pwa/*', 'tailwindcss', '@tailwindcss/*']
      lint:
        patterns: ['eslint', 'eslint-*', '@eslint/*', 'typescript-eslint', 'prettier', 'globals']
      testing:
        patterns:
          ['vitest', '@vitest/*', '@testing-library/*', 'jsdom', 'supertest', '@types/supertest']
    ignore:
      # TypeScript 7 (compilador nativo) aún no es compatible con typescript-eslint ni con Nest CLI.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /apps/backend
    schedule:
      interval: monthly
